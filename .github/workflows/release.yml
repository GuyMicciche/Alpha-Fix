name: Build and release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
            arch: arm64
          - runner: macos-15-intel
            platform: macos-x86_64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set package version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
            echo "ALPHAFIX_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "ALPHAFIX_VERSION=$(python scripts/version.py)" >> "$GITHUB_ENV"
          fi
      - name: Extract After Effects SDK
        run: python scripts/extract-dependency.py AfterEffectsSDK/AfterEffectsSDK.zip AfterEffectsSDK Headers/AE_Effect.h
      - name: Set up MSYS2 for minimal Windows FFmpeg
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make curl tar diffutils
      - name: Cache minimal Windows FFmpeg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-win-minimal
          key: ffmpeg-8.1-msvc-x64-minimal-${{ hashFiles('scripts/build-ffmpeg-win.sh') }}
      - name: Cache Mac FFmpeg
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-mac-${{ matrix.arch }}
          key: ffmpeg-8.1-macos12-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg-mac.sh') }}
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: call buildwin.bat --no-install --no-pause
      - name: Build Mac
        if: runner.os == 'macOS'
        shell: bash
        run: bash buildmac.sh --no-install --arch '${{ matrix.arch }}'
      - name: Save Mac build diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mac-diagnostics-${{ matrix.arch }}
          path: |
            Mac/ffmpeg-*/ffmpeg-*/ffbuild/config.log
            Mac/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath "Release-Alpha-Fix/$env:ALPHAFIX_VERSION/Alpha Fix" -DestinationPath "dist/Alpha-Fix-v$env:ALPHAFIX_VERSION-windows-x64.zip"
          python scripts/verify-package.py "dist/Alpha-Fix-v$env:ALPHAFIX_VERSION-windows-x64.zip"
      - name: Package Mac
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist "Mac/package/Alpha Fix"
          ditto "Mac/$ARCH-Release/Alpha_Fix.plugin" "Mac/package/Alpha Fix/Alpha_Fix.plugin"
          cp README.md "Mac/package/Alpha Fix/"
          ditto -c -k --keepParent "Mac/package/Alpha Fix" "dist/Alpha-Fix-v$ALPHAFIX_VERSION-macos-$ARCH.zip"
          python3 scripts/verify-package.py "dist/Alpha-Fix-v$ALPHAFIX_VERSION-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Fix-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    # Manual branch runs validate builds without publishing a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Alpha-Fix-*
          merge-multiple: true
          path: dist
      - name: Publish release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Alpha Fix $TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
